<div class="shell-layout" (click)="closeUserMenu()">
  <!-- Top Navigation Bar -->
  <nav class="top-nav">
    <div class="nav-content">
      <div class="nav-brand">
        <a routerLink="/" class="brand-link">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
            </svg>
          </div>
          <span class="brand-name">NCloudLab</span>
          <span class="host-pill">HOST SHELL</span>
        </a>
      </div>

      <div class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Host Home</span>
        </a>

        <a routerLink="/app-cloud-demo" routerLinkActive="active" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
          <span>app-cloud-demo (Remote)</span>
          <span class="remote-badge">Remote MFE</span>
        </a>
      </div>

      <div class="nav-right">
        <div class="nav-status">
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-text">Nx Federation Active</span>
          </div>
        </div>

        <!-- Google Authentication Actions in Navbar -->
        <div class="nav-auth" (click)="$event.stopPropagation()">
          <!-- Unauthenticated state: Login Button -->
          <button
            *ngIf="!authService.isAuthenticated()"
            type="button"
            class="btn-nav-login"
            (click)="openLoginModal()"
          >
            <div class="google-logo-wrapper">
              <svg class="google-logo" width="16" height="16" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24Z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
              </svg>
            </div>
            <span>Đăng Nhập Google</span>
          </button>

          <!-- Authenticated state: User Chip + Dropdown -->
          <div *ngIf="authService.currentUser() as user" class="user-chip-container">
            <button
              type="button"
              class="user-chip"
              (click)="toggleUserMenu()"
              [attr.aria-expanded]="isUserMenuOpen()"
            >
              <div class="user-chip-avatar-wrapper">
                <img
                  *ngIf="user.picture"
                  [src]="user.picture"
                  [alt]="user.name"
                  class="chip-avatar"
                  (error)="user.picture = ''"
                />
                <div *ngIf="!user.picture" class="chip-avatar-fallback">
                  {{ user.name.charAt(0).toUpperCase() }}
                </div>
                <span class="user-chip-dot"></span>
              </div>
              <span class="chip-name">{{ user.name }}</span>
              <svg
                class="chip-chevron"
                [class.open]="isUserMenuOpen()"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>

            <!-- User Menu Dropdown -->
            <div *ngIf="isUserMenuOpen()" class="user-dropdown-menu">
              <div class="dropdown-header">
                <div class="dropdown-user-name">{{ user.name }}</div>
                <div class="dropdown-user-email">{{ user.email }}</div>
                <div class="dropdown-user-badge">
                  <span class="dot"></span>
                  {{ user.authProvider === 'google' ? 'Google OAuth 2.0' : 'Demo Account' }}
                </div>
              </div>
              <div class="dropdown-divider"></div>
              <button type="button" class="dropdown-item" (click)="openProfileModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Hồ Sơ & JWT Claims</span>
              </button>
              <button type="button" class="dropdown-item" (click)="openLoginModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>Cấu Hình Client ID</span>
              </button>
              <div class="dropdown-divider"></div>
              <button type="button" class="dropdown-item danger" (click)="logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Đăng Xuất</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main View Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Modals -->
  <app-login-modal></app-login-modal>
  <app-profile-modal></app-profile-modal>
</div>
