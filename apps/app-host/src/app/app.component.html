<div class="shell-layout">
  <!-- Top Navigation Bar -->
  <nav class="top-nav">
    <div class="nav-content">
      <div class="nav-brand">
        <a routerLink="/" class="brand-link">
          <div class="brand-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
            </svg>
          </div>
          <span class="brand-name">OnePortal</span>
          <span class="host-pill">HOST SHELL</span>
        </a>
      </div>

      <div class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Host Home</span>
        </a>

        <a routerLink="/app-cloud-demo" routerLinkActive="active" class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
          <span>app-cloud-demo (Remote)</span>
          <span class="remote-badge">Remote MFE</span>
        </a>
      </div>

      <div class="nav-status">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">Nx Federation Active</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main View Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
