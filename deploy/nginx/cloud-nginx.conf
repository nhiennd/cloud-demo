# ==============================================================================
# Nginx Reverse Proxy Configuration for Cloud Server (Ubuntu / Debian / CentOS)
# Copy to: /etc/nginx/sites-available/cloud-demo.conf
# Enable:  ln -s /etc/nginx/sites-available/cloud-demo.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Upstream definitions to Docker containers
upstream app_host_upstream {
    server 127.0.0.1:4200;
    keepalive 32;
}

upstream app_cloud_demo_upstream {
    server 127.0.0.1:4201;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. Cấu hình HTTP (Port 80)
# (Dùng trực tiếp qua IP hoặc tự động chuyển hướng sang HTTPS khi có tên miền)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com; # Thay bằng Domain hoặc IP máy chủ

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;

    # 1.1 Proxy tới App Remote (Port 4201) khi truy cập cổng 4201 hoặc path remote
    location /app-cloud-demo/ {
        proxy_pass http://app_cloud_demo_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS Headers cho Module Federation
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;
    }

    # 1.2 Proxy tới App Host Shell (Port 4200)
    location / {
        proxy_pass http://app_host_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

