name: CI/CD Pipeline - Angular Micro-Frontend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # 1. CI Job: Lint, Typecheck, and Build using Nx
  # ============================================================
  ci-build:
    name: 🔍 Lint & Build (Nx Monorepo)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build all applications in production mode
        run: npx nx run-many -t build --configuration=production

      - name: 📤 Archive Host build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-host-dist
          path: dist/apps/app-host
          retention-days: 7

      - name: 📤 Archive Remote build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-cloud-demo-dist
          path: dist/apps/app-cloud-demo
          retention-days: 7

  # ============================================================
  # 2. CD Job: Build & Push Docker Images (GHCR / Local)
  # ============================================================
  docker-build:
    name: 🐳 Build & Push Docker Images
    needs: ci-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Convert repo name to lowercase
        run: |
          echo "IMAGE_HOST_LOWER=$(echo '${{ github.repository }}/app-host' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_REMOTE_LOWER=$(echo '${{ github.repository }}/app-cloud-demo' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata (app-host)
        id: meta-host
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_HOST_LOWER }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Build & Push Docker Image (app-host)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/app-host/Dockerfile
          push: true
          tags: ${{ steps.meta-host.outputs.tags }}
          labels: ${{ steps.meta-host.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏷️ Extract Docker metadata (app-cloud-demo)
        id: meta-remote
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REMOTE_LOWER }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Build & Push Docker Image (app-cloud-demo)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/app-cloud-demo/Dockerfile
          push: true
          tags: ${{ steps.meta-remote.outputs.tags }}
          labels: ${{ steps.meta-remote.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 3. Optional CD Job: SSH Auto-Deploy to Cloud Server
  # (Kích hoạt khi đã cấu hình GitHub Secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY)
  # ============================================================
  deploy-to-cloud:
    name: 🌐 Auto Deploy to Cloud Server
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 SSH Deploy to Cloud Server
        if: ${{ env.SERVER_HOST != '' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /var/www/cloud-demo || exit 1
            export GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            export GHCR_USER="${{ github.actor }}"
            bash deploy/scripts/deploy.sh latest
